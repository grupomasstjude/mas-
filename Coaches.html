		<style>
			body {font-family:sans-serif; line-height:2em;
				background:white}
			div#above-fold {background:white; padding:4em 0}
			div#below-fold {display:none}
			div#below-fold.expanded {display:block}
			div#fold .fold-bkg {
				height:75px; margin-bottom:2em;
				opacity:0.5;
				background-image:url("img/mas/patterns/evidence.png");
				background-repeat:repeat;
				background-size:75px}
				div#fold span.expand {display:inline-block}
				div#fold span.contract {display:none}
				div#fold.expanded span.expand {display:none}
				div#fold.expanded span.contract {display:inline-block}
			div#fold a {color:#777}
			div#fold a:hover {color:#000}

			/* Background */
			#top-bkg {position:fixed; top:0; right:0; width:100%; height:4em; background:transparent url("img/bkg/red-repeat.png") repeat-x fixed top; background-size:auto 4em; z-index:10; text-align:right}
				#top-bkg::after, #bottom-bkg::after { content:""; position:absolute; bottom:0; left:0; width:100%; height:4em; background:transparent url("img/bkg/red-corner.png") no-repeat right bottom; background-size:auto 4em; }
				/* Colors */
					.gray #top-bkg {background-image:url("img/bkg/gray-repeat.png")}
						.gray #top-bkg:after {background-image:url("img/bkg/gray-corner.png")}
					.green #top-bkg {background-image:url("img/bkg/green-repeat.png")}
						.green #top-bkg:after {background-image:url("img/bkg/green-corner.png")}
					.blue #top-bkg {background-image:url("img/bkg/blue-repeat.png")}
						.blue #top-bkg:after {background-image:url("img/bkg/blue-corner.png")}
					.yellow #top-bkg {background-image:url("img/bkg/yellow-repeat.png")}
						.yellow #top-bkg:after {background-image:url("img/bkg/yellow-corner.png")}
			#bottom-bkg {position:fixed; bottom:0; left:0; width:100%; height:4em; z-index:10}
				#bottom-bkg::before { content:""; position:absolute; bottom:0; width:100%; height:100%; background:transparent url("img/bkg/red-repeat.png") repeat-x fixed bottom; background-size:auto 4em; transform:scaleX(-1) scaleY(-1); }
				#bottom-bkg::after { transform:scaleX(-1) scaleY(-1); }
				/* Colors */
					.gray #bottom-bkg::before {background-image:url("img/bkg/gray-repeat.png")}
						.gray #bottom-bkg::after {background-image:url("img/bkg/gray-corner.png")}
					.green #bottom-bkg::before {background-image:url("img/bkg/green-repeat.png")}
						.green #bottom-bkg::after {background-image:url("img/bkg/green-corner.png")}
					.blue #bottom-bkg::before {background-image:url("img/bkg/blue-repeat.png")}
						.blue #bottom-bkg::after {background-image:url("img/bkg/blue-corner.png")}
					.yellow #bottom-bkg::before {background-image:url("img/bkg/yellow-repeat.png")}
						.yellow #bottom-bkg::after {background-image:url("img/bkg/yellow-corner.png")}
			#bottom-bkg img {height:4em; transform:scaleX(-1) scaleY(-1) }

			.title {color:#000}/*; border-bottom:5px solid #c50b3b}*/
			.title a {color:#000; text-decoration:underline;}
				
			
			#sources {margin-top:2em; background:transparent}
			.btn { margin-bottom:10px; color:white }
				.btn img {height:2em}
				.btn-label {position: relative;left: -12px;display: inline-block;padding: 6px 12px;background: rgba(0,0,0,0.15);border-radius: 3px 0 0 3px;}
					.btn-outline-label {position:relative; display: inline-block; padding:3px 0; padding-right:12px; border-radius: 3px 0 0 3px;}
					.btn-blank-label {display:inline-block; height:2.4em; vertical-align:middle; padding:3px 0}
					.btn-labeled {padding-top: 0;padding-bottom: 0;}
				/* Quality */
					.btn.quality, .btn:hover.quality-outline {background:#E5BF23}
					.btn.quality .btn-label {background:#FFD100}
					.btn.quality-outline {border-color:#E5BF23; color:#E5BF23}
				/* Collaboration */
					.btn.collaboration, .btn:hover.collaboration-outline {background:#EF432D}
					.btn.collaboration .btn-label {background:#EF7E75}
					.btn.collaboration-outline {border-color:#EF432D; color:#EF432D}
				/* Modernization */
					.btn.modernization, .btn:hover.modernization-outline {background:#74BD9F}
					.btn.modernization .btn-label {background:#8DE2BB}
					.btn.modernization-outline {border-color:#52BA8B; color:#52BA8B}
				/* Evidence */
					.btn.evidence, .btn:hover.evidence-outline {background:#1F6868}
					.btn.evidence .btn-label {background:#4D9E9E}
					.btn.evidence-outline {border-color:#3B7082; color:#3B7082}
				/* HOVER */
				.btn:hover .btn-label {background:transparent}
				.btn:hover {color:white}
				.btn:hover .btn-outline-label img {-webkit-filter: brightness(0) invert(100%); }
			big {display:inline-block; margin:0.5em 0.25em; font-size:1.5em}

			.tarjetas .btn {border-color:#989DA3; color:#989DA3; background:transparent}
			.tarjetas .btn .btn-label {background:transparent}
			.tarjetas .btn:hover {background:#eee; border-color:#555 color:#555}

			.aggregate .btn {background:#5c646a}
			.aggregate .btn .btn-label {background:#6c757d}
			.aggregate .btn:hover .btn-label {background:#5c646a}

			.form, .app, .aggregate .app {padding:0; border-radius:0 .25rem .25rem 0; border-width:0; background:#fff}
			.form img, .app img {height:2.5em; opacity:0.5}
			.form img:hover, .app img:hover {opacity:1}
			.preform {border-radius:.25rem 0 0 .25rem}
		</style>
